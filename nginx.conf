server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 리버스 프록시(HTTPS) 뒤에서 /posts/slug → /posts/slug/ 리다이렉트가
    # 내부 주소(http://...:80)로 튀지 않도록 상대 경로로 보낸다.
    absolute_redirect off;

    gzip on;
    gzip_types text/css text/plain application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # 폰트는 파일명이 바뀌지 않는 한 그대로이므로 길게 캐시
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # HTML/CSS는 글 수정이 바로 보이도록 매번 재검증
    location ~* \.(html|css)$ {
        add_header Cache-Control "no-cache";
    }
}
